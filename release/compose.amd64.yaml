name: parceldesk-amd64
services:
  postgres:
    platform: linux/amd64
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: parceldesk
      POSTGRES_USER: parceldesk
      POSTGRES_PASSWORD: architecture-test-only
    volumes: ["amd64-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parceldesk -d parceldesk"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 384m
  operations:
    platform: linux/amd64
    image: parceldesk/operations:0.1.0-amd64
    environment:
      DATABASE_URL: postgres://parceldesk:architecture-test-only@postgres:5432/parceldesk?sslmode=disable
      INTERNAL_SERVICE_TOKEN: architecture-test-only
      CARRIER_URL: http://carrier:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      OTEL_EXPORTER_OTLP_HEADERS: ''
    depends_on:
      postgres: {condition: service_healthy}
    cpus: 1.0
    mem_limit: 256m
  carrier:
    platform: linux/amd64
    image: parceldesk/operations:0.1.0-amd64
    entrypoint: /usr/local/bin/carrier
    environment:
      INTERNAL_SERVICE_TOKEN: architecture-test-only
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      OTEL_EXPORTER_OTLP_HEADERS: ''
    mem_limit: 128m
  telemetry:
    platform: linux/amd64
    image: python:3.12.13-alpine
    command: ["python", "/app/telemetry_sink.py"]
    volumes: ["./amd64/telemetry_sink.py:/app/telemetry_sink.py:ro"]
    mem_limit: 64m
  agent-api:
    platform: linux/amd64
    image: parceldesk/agent-api:0.1.0-amd64
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
      OTEL_EXPORTER_OTLP_HEADERS: ''
      AGENTO11Y_ENDPOINT: http://telemetry:4318
      CLOUD_TENANT: amd64-local
      AGENTO11Y_AUTH_TOKEN: architecture-local-only
      AGENT_PACKAGE_ROOT: /tmp/packages
      ACTIVE_AGENT_MANIFEST: /tmp/active.json
      OPERATIONS_URL: http://operations:8080
      INTERNAL_SERVICE_TOKEN: architecture-test-only
      SESSION_KEY: architecture-session-key-only
      LLM_PROVIDER: anthropic
      LLM_MODEL: claude-haiku-4-5-20251001
      PYTHONPATH: /app/src:/app/tools
      PARCELDESK_DEVELOPMENT_DB: /tmp/development.sqlite
      PARCELDESK_CONTROLLER_STATE: /tmp/controller.json
    secrets: [anthropic_key]
    volumes:
      - ../tools:/app/tools:ro
      - ../evals:/app/evals:ro
      - ../fixtures:/app/fixtures:ro
      - amd64-runs:/app/runs
    depends_on: [operations,carrier,telemetry]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
    mem_limit: 512m
  web:
    platform: linux/amd64
    image: parceldesk/web:0.1.0-amd64
    ports: ["127.0.0.1:3190:8080"]
    volumes: ["./amd64/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      agent-api: {condition: service_healthy}
    mem_limit: 128m
volumes:
  amd64-postgres:
  amd64-runs:
secrets:
  anthropic_key:
    file: ../.secrets/anthropic_key
