server {
 listen 8080;
 server_name localhost;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 client_max_body_size 64k;
 location / { try_files $uri $uri/ /index.html; }
 location = /health/live { return 200 "ok"; }
 location /images/ { expires 7d; }
 location /api/ { proxy_pass http://agent-api:8000; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 100s; }
 location /collect { proxy_pass https://faro-collector-prod-eu-west-2.grafana.net/collect/REPLACE_WITH_FARO_APP_KEY; proxy_ssl_server_name on; proxy_set_header Host faro-collector-prod-eu-west-2.grafana.net; }
 location /control/ { return 404; }
}
server {
 listen 8081;
 server_name localhost;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://agent-api:8000; proxy_buffering off; proxy_read_timeout 100s; }
 location /control/ { client_max_body_size 64k; proxy_pass http://agent-api:8000; proxy_read_timeout 60s; }
 location /collect { return 204; }
}
