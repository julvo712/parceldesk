server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /health/live { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ { proxy_pass http://agent-api:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_read_timeout 180s; }
  location /control/ { return 404; }
  location = /collect { proxy_pass http://alloy:12347/collect; proxy_set_header Host $host; proxy_read_timeout 15s; }
  location /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; try_files $uri =404; }
  location /images/ { expires 1h; try_files $uri =404; }
  location / { add_header Cache-Control 'no-cache'; try_files $uri $uri/ /index.html; }
}
